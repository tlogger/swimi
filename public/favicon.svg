<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 배경 그라디언트 (Deep Ocean) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 머티리얼 입체 섀도우 -->
    <filter id="elevatedShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#021a2f" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#021a2f" flood-opacity="0.3" />
    </filter>

    <!-- 내부 요소 소프트 섀도우 -->
    <filter id="innerDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#032540" flood-opacity="0.4" />
    </filter>

    <!-- 상단 스트로크 웨이브 그라디언트 -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 메인 S-물결 그라디언트 (Vibrant Aqua Teal) -->
    <linearGradient id="mainWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- 하단 서브 물결 그라디언트 -->
    <linearGradient id="subWaveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- 헤드 앰플 그라디언트 -->
    <linearGradient id="headGrad" x1="20%" y1="20%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- 메인 둥근 사각 컨테이너 (Material Squircle Container) -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="116"
    ry="116"
    fill="url(#bgGrad)"
    filter="url(#elevatedShadow)"
  />

  <!-- 미세한 상단 내부 하이라이트 림 -->
  <rect
    x="25"
    y="25"
    width="462"
    height="462"
    rx="115"
    ry="115"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.18"
    stroke-width="2"
  />

  <!-- 수영장 레인 라인 텍스처 (Lane Lines, 은은한 배경 요소) -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round">
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="352" x2="432" y2="352" />
  </g>

  <!-- 하단 보조 물결 (Dynamic Ripple / Water Tail) -->
  <path
    d="M 110 330 C 160 300, 210 375, 275 365 C 335 355, 375 305, 410 320 C 375 375, 310 405, 250 395 C 185 385, 150 355, 110 330 Z"
    fill="url(#subWaveGrad)"
    opacity="0.85"
    filter="url(#innerDrop)"
  />

  <!-- 메인 S-물결 바디 (Swimmer Body & Wave Stream) -->
  <path
    d="M 125 240 C 165 175, 240 180, 290 220 C 345 265, 385 245, 415 225 C 390 305, 325 330, 270 300 C 220 270, 175 295, 125 240 Z"
    fill="url(#mainWaveGrad)"
    filter="url(#innerDrop)"
  />

  <!-- 상단 자유형 다이내믹 암 스트로크 (Swimmer Forward Stroke) -->
  <path
    d="M 175 185 C 215 125, 295 110, 360 145 C 390 160, 410 185, 418 200 C 390 185, 355 170, 320 168 C 265 165, 215 200, 175 185 Z"
    fill="url(#streamGrad1)"
    filter="url(#innerDrop)"
  />

  <!-- 수영선수 헤드 & 전진 스플래시 (Swimmer Head & Material Sphere) -->
  <circle
    cx="255"
    cy="148"
    r="36"
    fill="url(#headGrad)"
    filter="url(#innerDrop)"
  />

  <!-- 수영모 고글 씬 하이라이트 (Goggle Reflection Arc) -->
  <path
    d="M 242 144 C 254 136, 272 138, 280 148"
    fill="none"
    stroke="#0284c7"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- 전방 상쾌한 스파크 물방울 (Energy Droplet) -->
  <circle
    cx="388"
    cy="130"
    r="10"
    fill="#ffffff"
    opacity="0.9"
  />
  <circle
    cx="418"
    cy="154"
    r="6"
    fill="#67e8f9"
    opacity="0.8"
  />
</svg>
